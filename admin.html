<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Phenomiq Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

<div id="login-view" class="flex items-center justify-center min-h-screen p-4">
  <form id="login-form" class="bg-gray-800 p-8 rounded-2xl w-full max-w-sm space-y-4">
    <h1 class="text-xl font-bold text-center">Phenomiq Admin</h1>
    <input id="login-email" type="email" placeholder="Email" required
      class="w-full bg-gray-700 rounded-lg px-4 py-3 text-sm outline-none">
    <input id="login-password" type="password" placeholder="Password" required
      class="w-full bg-gray-700 rounded-lg px-4 py-3 text-sm outline-none">
    <button type="submit" class="w-full bg-cyan-500 rounded-full py-3 font-semibold">Log In</button>
    <p id="login-error" class="text-red-400 text-xs text-center hidden"></p>
  </form>
</div>

<div id="dashboard-view" class="hidden p-4 max-w-4xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-bold">Leads</h1>
    <button id="logout-btn" class="text-xs text-mute underline">Log out</button>
  </div>
  <div id="leads-list" class="space-y-3"></div>
</div>

<script>
  const { createClient } = supabase;
  const sb = createClient(
    "https://ypjfwhxjqzfgkeebkcrv.supabase.co",
    "sb_publishable_95wTzHJh6vZknOePzLqtYg_-c-Rg8h2"
  );

  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const leadsList = document.getElementById('leads-list');
  const logoutBtn = document.getElementById('logout-btn');

  async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      showDashboard();
    } else {
      showLogin();
    }
  }

  function showLogin() {
    loginView.classList.remove('hidden');
    dashboardView.classList.add('hidden');
  }

  async function showDashboard() {
    loginView.classList.add('hidden');
    dashboardView.classList.remove('hidden');
    loadLeads();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      loginError.textContent = "Invalid email or password.";
      loginError.classList.remove('hidden');
    } else {
      showDashboard();
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await sb.auth.signOut();
    showLogin();
  });

  async function loadLeads() {
    leadsList.innerHTML = "Loading...";
    const { data, error } = await sb
      .from('leads')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      leadsList.innerHTML = `<p class="text-red-400">Failed to load leads.</p>`;
      return;
    }

    if (!data.length) {
      leadsList.innerHTML = `<p class="text-mute">No leads yet.</p>`;
      return;
    }

    leadsList.innerHTML = data.map(lead => `
      <div class="bg-gray-800 rounded-xl p-4 ${lead.contacted ? 'opacity-50' : ''}">
        <div class="flex justify-between text-xs text-mute mb-2">
          <span>${new Date(lead.created_at).toLocaleString()}</span>
          ${lead.contacted ? '<span class="text-emerald-400">✓ Contacted</span>' : ''}
        </div>
        <p class="font-semibold">${lead.name}</p>
        <p class="text-sm text-cyan-400">${lead.contact}</p>
        <p class="text-sm mt-2">${lead.message}</p>
                <div class="flex gap-2 mt-3">
          <button onclick="toggleContacted('${lead.id}', ${lead.contacted})"
            class="text-xs bg-gray-700 hover:bg-gray-600 rounded-full px-4 py-2">
            ${lead.contacted ? 'Mark as not contacted' : 'Mark as contacted'}
          </button>
          <button onclick="deleteLead('${lead.id}')"
            class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded-full px-4 py-2">
            Delete
          </button>
        </div>
      </div>
    `).join('');
  }

  window.toggleContacted = async function(id, currentStatus) {
    const { error } = await sb
      .from('leads')
      .update({ contacted: !currentStatus })
      .eq('id', id);

    if (!error) {
      loadLeads();
    }
  }

    window.deleteLead = async function(id) {
    if (!confirm("Delete this lead? This can't be undone.")) return;

    const { error } = await sb
      .from('leads')
      .delete()
      .eq('id', id);

    if (!error) {
      loadLeads();
    }
    }
  
  checkSession();
</script>
</body>
</html>
