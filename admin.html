<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F131A">
<title>Phenomiq Admin</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
<script src="js/supabase-config.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="js/admin.js" defer></script>
</head>
<body class="admin">

<!-- Login -->
<main id="login-view" class="login">
  <form id="login-form" class="login-card">
    <img src="assets/logos/phenomiq-logo-horizontal-white.svg" alt="Phenomiq" width="121" height="40">
    <h1>Admin</h1>
    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Log in</button>
    <p id="login-error" class="form-note is-error" role="alert" hidden></p>
  </form>
</main>

<!-- Dashboard -->
<div id="dashboard-view" class="dash" hidden>
  <header class="dash-head">
    <img src="assets/logos/phenomiq-logo-horizontal-white.svg" alt="Phenomiq" width="121" height="40">
    <button id="logout-btn" class="btn btn-ghost" type="button">Log out</button>
  </header>

  <main class="dash-main">
    <div class="dash-title">
      <h1>Leads</h1>
      <p id="lead-count" class="label"></p>
    </div>
    <div class="field">
      <label class="visually-hidden" for="search-box">Search leads</label>
      <input id="search-box" type="search" placeholder="Search by name, email or message">
    </div>
    <div id="leads-list" class="leads" aria-live="polite"></div>
  </main>
</div>

</body>
</html>
